# The brief: what the reader service answers for, as cases, each need bound
# to the claims proving it. The trial is the examiner's: arbiter performs the
# moves through the door and reads the store raw over its own connection.

[[case]]
name = "bookmarks"
story = "a reader keeps their place in every book, across restarts"
unit = "."

  [case.trial]
  sequence = "persistence"
  proves = [
    "a bookmark is created, read, moved and forgotten",
    "a reader's place survives a restart",
  ]
  store = "sqlite"
  volume = "reader-data"
  path = "marks.db"
  create = { method = "PUT", route = "/marks/ada/sicp", body = '{"page": 12}' }
  update = { method = "PUT", route = "/marks/ada/sicp", body = '{"page": 40}' }
  delete = { method = "DELETE", route = "/marks/ada/sicp" }
  read = { method = "GET", route = "/marks/eve/tao", answer = '{"page": 7}' }
  probe = "SELECT page FROM bookmarks WHERE reader = 'ada' AND book = 'sicp'"
  created = "12"
  updated = "40"
  seed = "INSERT INTO bookmarks (reader, book, page) VALUES ('eve', 'tao', 7)"

  [[case.flow]]
  name = "a reader marks their place"
  steps = [
    { via = "reader.local", to = "reader", does = "PUT the mark" },
    { from = "reader", to = "reader-data", does = "the mark lands on the volume" },
    { back = "204: the mark is kept" },
  ]
  forks = [
    { at = "reader", when = "the body names no page", back = "400: refused" },
    { at = "reader", when = "the mark was never made", back = "404: nothing to serve" },
  ]

  [[case.need]]
  need = "a bookmark is created, read, moved and forgotten"
  claims = [
    ". |  | a bookmark is kept and read back",
    ". |  | a moved bookmark reads at its new page",
    ". |  | a forgotten bookmark is gone",
  ]

  [[case.need]]
  need = "a reader's place survives a restart"
  claims = [". |  | a bookmark survives a reopen"]

  [[case.need]]
  need = "bookmarks are served over the reader's door"
  claims = [". |  | the door serves a mark round trip"]
