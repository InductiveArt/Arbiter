# The brief: what the cinema answers for, as cases, each need bound to the
# claims proving it. Four trials are the examiner's - it performs the moves
# through each door and reads each store raw over its own connection.
# Shelving alone has no trial: its truth rides the channels to gate and
# catalog, so its needs stay tested, never verified by one service alone.

[[case]]
name = "watching"
story = "a member watches a rented title and resumes where they left"
unit = "services/player"

  [case.trial]
  sequence = "persistence"
  proves = [
    "a resume point is kept, read and moved",
    "a resume point survives a restart",
  ]
  store = "sqlite"
  volume = "player-data"
  path = "progress.db"
  create = { method = "PUT", route = "/progress/ada/arrival", body = '{"second": 300}' }
  update = { method = "PUT", route = "/progress/ada/arrival", body = '{"second": 900}' }
  delete = { method = "DELETE", route = "/progress/ada/arrival" }
  read = { method = "GET", route = "/progress/eve/tao", answer = '{"second": 7}' }
  probe = "SELECT second FROM progress WHERE member = 'ada' AND slug = 'arrival'"
  created = "300"
  updated = "900"
  seed = "INSERT INTO progress (member, slug, second) VALUES ('eve', 'tao', 7)"

  [[case.need]]
  need = "a stream opens only against a standing rental"
  claims = [
    "services/player |  | a stream opens against a standing rental",
    "services/player |  | an unrented title refuses to play",
  ]

  [[case.need]]
  need = "an unknown title refuses to play"
  claims = ["services/player |  | an unknown title refuses to play"]

  [[case.need]]
  need = "a resume point is kept, read and moved"
  claims = [
    "services/player |  | a resume point is kept and read back",
    "services/player |  | a moved resume point reads at the new second",
    "services/player |  | a cleared resume point is gone",
    "services/player |  | the door keeps a resume point round trip",
  ]

  [[case.need]]
  need = "a resume point survives a restart"
  claims = ["services/player |  | a resume point survives a reopen"]

[[case]]
name = "rentals"
story = "a rental opens a title to a member for some nights"
unit = "services/tickets"
serves = "a stream opens only against a standing rental"

  [case.trial]
  sequence = "persistence"
  proves = [
    "a rental is opened, read, extended and cancelled",
    "rentals survive a restart",
  ]
  store = "sqlite"
  volume = "tickets-data"
  path = "tickets.db"
  create = { method = "PUT", route = "/tickets/ada/arrival", body = '{"nights": 2}' }
  update = { method = "PUT", route = "/tickets/ada/arrival", body = '{"nights": 5}' }
  delete = { method = "DELETE", route = "/tickets/ada/arrival" }
  read = { method = "GET", route = "/tickets/eve/tao", answer = '{"nights": 1}' }
  probe = "SELECT nights FROM tickets WHERE member = 'ada' AND slug = 'arrival'"
  created = "2"
  updated = "5"
  seed = "INSERT INTO tickets (member, slug, nights) VALUES ('eve', 'tao', 1)"

  [[case.need]]
  need = "a rental is opened, read, extended and cancelled"
  claims = [
    "services/tickets |  | a rental is opened and read back",
    "services/tickets |  | an extended rental reads at the new nights",
    "services/tickets |  | a cancelled rental is gone",
    "services/tickets |  | the door serves a rental round trip",
  ]

  [[case.need]]
  need = "rentals survive a restart"
  claims = ["services/tickets |  | rentals survive a reopen"]

[[case]]
name = "shelving"
story = "a member keeps a list of titles to watch later"
unit = "services/shelf"

  [[case.need]]
  need = "a title is shelved and the shelf reads back"
  claims = [
    "services/shelf |  | a shelved title reads back",
    "services/shelf |  | an unshelved title leaves the shelf",
    "services/shelf |  | the door shelves for a known member and title",
  ]

  [[case.need]]
  need = "a stranger is turned away"
  claims = ["services/shelf |  | a stranger is turned away at the door"]

  [[case.need]]
  need = "a title the catalog does not carry is refused"
  claims = ["services/shelf |  | a title the catalog does not carry is refused"]

[[case]]
name = "membership"
story = "the house knows its members by handle, across restarts"
unit = "services/gate"
serves = "a stranger is turned away"

  [case.trial]
  sequence = "persistence"
  proves = [
    "a member is enrolled, read, renamed and struck",
    "the member roll survives a restart",
  ]
  store = "sqlite"
  volume = "gate-data"
  path = "members.db"
  create = { method = "PUT", route = "/members/ada", body = '{"name": "Ada Lovelace"}' }
  update = { method = "PUT", route = "/members/ada", body = '{"name": "Ada King"}' }
  delete = { method = "DELETE", route = "/members/ada" }
  read = { method = "GET", route = "/members/eve", answer = '{"name": "Eve"}' }
  probe = "SELECT name FROM members WHERE handle = 'ada'"
  created = "Ada Lovelace"
  updated = "Ada King"
  seed = "INSERT INTO members (handle, name) VALUES ('eve', 'Eve')"

  [[case.need]]
  need = "a member is enrolled, read, renamed and struck"
  claims = [
    "services/gate |  | a member is enrolled and read back",
    "services/gate |  | a renamed member reads at the new name",
    "services/gate |  | a struck member is gone",
    "services/gate |  | the door serves a member round trip",
  ]

  [[case.need]]
  need = "the member roll survives a restart"
  claims = ["services/gate |  | the member roll survives a reopen"]

[[case]]
name = "the catalog"
story = "the titles the house carries, each with its minutes"
unit = "services/catalog"
serves = "a title the catalog does not carry is refused"

  [case.trial]
  sequence = "persistence"
  proves = [
    "a title is added, read, corrected and withdrawn",
    "the catalog survives a restart",
  ]
  store = "sqlite"
  volume = "catalog-data"
  path = "titles.db"
  create = { method = "PUT", route = "/titles/arrival", body = '{"name": "Arrival", "minutes": 116}' }
  update = { method = "PUT", route = "/titles/arrival", body = '{"name": "Arrival", "minutes": 118}' }
  delete = { method = "DELETE", route = "/titles/arrival" }
  read = { method = "GET", route = "/titles/tao", answer = '{"name": "Tao", "minutes": 95}' }
  probe = "SELECT minutes FROM titles WHERE slug = 'arrival'"
  created = "116"
  updated = "118"
  seed = "INSERT INTO titles (slug, name, minutes) VALUES ('tao', 'Tao', 95)"

  [[case.need]]
  need = "a title is added, read, corrected and withdrawn"
  claims = [
    "services/catalog |  | a title is added and read back",
    "services/catalog |  | a corrected title reads at the new minutes",
    "services/catalog |  | a withdrawn title is gone",
    "services/catalog |  | the door serves a title round trip",
  ]

  [[case.need]]
  need = "the catalog survives a restart"
  claims = ["services/catalog |  | the catalog survives a reopen"]
