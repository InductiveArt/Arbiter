# The adapter: what holds a Python unit to the bar, in the order run.
# Each tool is pinned, so every unit is held to one bar, not to a machine's.
[[check]]
name = "format"
run = ["uvx", "ruff@0.17.1", "format", "--check", "--config", "{pack}/ruff.toml", "."]

[[check]]
name = "lint"
run = ["uvx", "ruff@0.17.1", "check", "--config", "{pack}/ruff.toml", "."]

[[check]]
name = "types"
run = ["uv", "run", "--no-sync", "--with", "basedpyright==1.40.2", "basedpyright"]

[[check]]
name = "test"
run = ["uv", "run", "--no-sync", "--with", "pytest==9.1.1", "pytest", "-q"]
