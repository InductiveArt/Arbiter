[package]
name = "arbiter"
version = "0.28.0"
edition = "2021"

[features]
# Tasks with no purpose but to show the runner at work, compiled in for its tests.
exhibit = []

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
streaming-iterator = "0.1"
toml = "0.8"
tree-sitter = "0.25"
tree-sitter-cpp = "0.23"
tree-sitter-proto = "0.6.0"
tree-sitter-python = "0.23"
tree-sitter-rust = "0.23"
tree-sitter-typescript = "0.23"

[dev-dependencies]
arbiter = { path = ".", features = ["exhibit"] }
