<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>arbiter court</title>
<script src="https://cdn.jsdelivr.net/npm/dagre@0.8.5/dist/dagre.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/cytoscape@3.30.2/dist/cytoscape.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/cytoscape-dagre@2.5.0/cytoscape-dagre.js"></script>
<style>
:root {
  --paper: #10141a; --panel: #161b23; --line: #272f3b; --ink: #d9dfe7;
  --dim: #8b95a3; --good: #7dc87d; --bad: #e07a7a; --warn: #d8b45f;
  --accent: #7aa7d8; --sel: #2c3a4d;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body { background: var(--paper); color: var(--ink); font: 13.5px/1.5 var(--mono);
       display: flex; flex-direction: column; overflow: hidden; }
.good { color: var(--good); } .bad { color: var(--bad); } .warn { color: var(--warn); }
.dim { color: var(--dim); } .accent { color: var(--accent); }
header { padding: .8rem 1.4rem .6rem; border-bottom: 1px solid var(--line);
         display: flex; align-items: baseline; gap: 1.2rem; flex-wrap: wrap; }
header h1 { font-size: 1.05rem; font-weight: 600; }
header .meta { color: var(--dim); font-size: .8rem; }
nav { display: flex; gap: .2rem; padding: 0 1rem; border-bottom: 1px solid var(--line); }
nav a { color: var(--dim); text-decoration: none; padding: .45rem .8rem; border-bottom: 2px solid transparent; }
nav a.on { color: var(--ink); border-bottom-color: var(--accent); }
nav a b { font-weight: 600; } nav a span { color: var(--dim); font-size: .8rem; }
nav a span.bad { color: var(--bad); }
#stage { flex: 1; display: flex; min-height: 0; }
#view { flex: 1; overflow: auto; padding: 1rem 1.3rem; min-width: 0; display: flex; flex-direction: column; }
#panel { width: 360px; border-left: 1px solid var(--line); overflow: auto;
         padding: 1rem 1.1rem; display: none; background: var(--panel); flex-shrink: 0; }
#panel.open { display: block; }
#reopen { display: none; position: absolute; right: 0; top: 40%; background: var(--panel);
          border: 1px solid var(--line); border-right: none; border-radius: 6px 0 0 6px;
          padding: .5rem .3rem; cursor: pointer; color: var(--dim); writing-mode: vertical-rl; }
#reopen.show { display: block; }
#stage { position: relative; }
#reopen { display: none; position: absolute; right: 0; top: 40%; background: var(--panel);
          border: 1px solid var(--line); border-right: none; border-radius: 6px 0 0 6px;
          padding: .5rem .35rem; cursor: pointer; color: var(--dim); writing-mode: vertical-rl; }
#reopen.show { display: block; }
#stage { position: relative; }
#panel h3 { font-size: .95rem; margin-bottom: .15rem; word-break: break-all; }
#panel .kind { color: var(--dim); font-size: .78rem; margin-bottom: .7rem; }
#panel h4 { color: var(--accent); font-size: .78rem; margin: .85rem 0 .25rem; text-transform: lowercase; }
#panel .row { margin: .1rem 0; word-break: break-all; }
#panel .row.link { cursor: pointer; }
#panel .row.link:hover { color: var(--accent); }
#panel .close { float: right; color: var(--dim); cursor: pointer; }
#panel a { color: var(--accent); cursor: pointer; text-decoration: underline; }
.crumbs { margin-bottom: .6rem; color: var(--dim); flex: none; }
.crumbs a { color: var(--accent); cursor: pointer; text-decoration: none; }
#cy { flex: 1; min-height: 380px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; }
.underside { flex: none; margin-top: .7rem; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
        padding: .75rem 1rem; margin-bottom: .7rem; overflow-x: auto; }
.card h3 { font-size: .9rem; margin-bottom: .4rem; }
table { border-collapse: collapse; width: 100%; }
th { text-align: left; color: var(--dim); font-weight: 500; padding: .12rem .9rem .3rem 0; }
td { padding: .12rem .9rem .12rem 0; vertical-align: top; }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--sel); }
.tag { display: inline-block; font-size: .7rem; padding: 0 .4rem; border-radius: 3px;
       border: 1px solid var(--line); color: var(--dim); margin-left: .45rem; }
.tag.core { color: var(--accent); border-color: var(--accent); }
.tag.record { color: var(--warn); border-color: var(--warn); }
.tag.id { color: var(--dim); cursor: copy; }
.finding { border-left: 3px solid var(--bad); padding: .15rem .6rem .15rem .8rem; margin: .5rem 0;
           cursor: pointer; border-radius: 0 4px 4px 0; }
.finding:hover { background: var(--sel); }
.finding .where { color: var(--dim); font-size: .8rem; }
.finding .where .go { color: var(--accent); }
.law { color: var(--dim); font-size: .8rem; }
.state-held { color: var(--good); } .state-open { color: var(--warn); }
.state-never, .state-planned, .state-manual { color: var(--dim); }
.state-unanswered { color: var(--bad); }
.empty { color: var(--dim); font-style: italic; }
.chips { display: flex; gap: .8rem; flex-wrap: wrap; margin-bottom: .9rem; }
.chip { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: .4rem .8rem; }
.chip b { font-size: 1.05rem; } .chip.bad b { color: var(--bad); }
.chip div { color: var(--dim); font-size: .75rem; }
.mode { margin-bottom: .5rem; color: var(--dim); }
.mode a { color: var(--dim); cursor: pointer; margin-right: .8rem; text-decoration: none; }
.mode a.on { color: var(--ink); border-bottom: 2px solid var(--accent); }
.grouprow { cursor: pointer; }
.grouprow:hover { background: var(--sel); }
.stage-ok { color: var(--good); } .stage-fail { color: var(--bad); } .stage-warm { color: var(--dim); }
.detail td { color: var(--dim); }
.outlink { color: var(--accent); cursor: pointer; text-decoration: underline; }
#overlay { position: fixed; inset: 0; background: rgba(5,8,12,.82); display: none;
           align-items: center; justify-content: center; z-index: 10; }
#overlay.open { display: flex; }
#overlay .box { background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
                width: min(950px, 92vw); max-height: 86vh; display: flex; flex-direction: column; }
#overlay .head { padding: .6rem 1rem; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; }
#overlay pre { overflow: auto; padding: 1rem; font-size: .8rem; white-space: pre-wrap; }
#filterbar { position: sticky; top: 0; z-index: 3; background: var(--paper);
             padding: .2rem 0 .6rem; }
#filterbar .card { margin-bottom: 0; }
details.group { background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
                padding: .4rem .8rem; margin-bottom: .55rem; }
details.group > summary { cursor: pointer; list-style: none; display: flex; gap: .8rem;
                          align-items: baseline; flex-wrap: wrap; }
details.group > summary::before { content: "▸ "; color: var(--dim); }
details.group[open] > summary::before { content: "▾ "; }
details.group .body { margin-top: .5rem; border-top: 1px solid var(--line); padding-top: .4rem; }
.hint { display: inline-block; font-size: .72rem; padding: 0 .45rem; border-radius: 3px;
        border: 1px solid var(--bad); color: var(--bad); }
.stagechip { font-size: .78rem; margin-right: .35rem; }
#pipe { background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
        margin-bottom: .9rem; overflow-x: auto; }
#pipe svg { display: block; }
#pipe .step rect { fill: #1d242e; stroke: var(--line); rx: 6; cursor: pointer; }
#pipe .step:hover rect { stroke: var(--accent); }
#pipe .step text { fill: var(--ink); font: 12px var(--mono); pointer-events: none; }
#pipe .step text.sub { fill: var(--dim); font-size: 10px; }
#pipe .step.red rect { stroke: var(--bad); }
#pipe .step.green rect { stroke: #4f7d4f; }
#pipe .flow { stroke: var(--dim); fill: none; marker-end: url(#parrow); opacity: .7; }
.legend { color: var(--dim); font-size: .78rem; margin: .4rem 0 .8rem; }
.planpick a { color: var(--dim); margin-right: .9rem; cursor: pointer; text-decoration: none; }
.planpick a.on { color: var(--ink); border-bottom: 2px solid var(--accent); }
svg.board { display: block; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; margin-bottom: .8rem; }
svg .node rect { fill: #1d242e; stroke: var(--line); rx: 5; cursor: pointer; }
svg .node:hover rect { stroke: var(--accent); }
svg .node text { fill: var(--ink); font: 12px var(--mono); pointer-events: none; }
svg .edge { stroke: var(--dim); fill: none; marker-end: url(#arrow); opacity: .75; }
svg .edge.channel { stroke: var(--accent); stroke-dasharray: 5 4; }
svg .edge.door { stroke: var(--warn); }
svg .machinebox { fill: none; stroke: var(--line); stroke-dasharray: 3 4; rx: 8; }
svg .machinelabel, svg .runglabel { fill: var(--dim); font: 11px var(--mono); }
svg .worldlabel { fill: var(--warn); font: 11px var(--mono); }
</style>
</head>
<body>
<header>
  <h1>arbiter court</h1>
  <div id="verdict"></div>
  <div class="meta" id="meta"></div>
</header>
<nav id="nav"></nav>
<div id="stage">
  <div id="view"></div>
  <aside id="panel"></aside>
  <div id="reopen">scope ⟨</div>
</div>
<div id="overlay"><div class="box"><div class="head"><b id="overlaytitle"></b><span class="close dim" style="cursor:pointer" onclick="closeOverlay()">x</span></div><pre id="overlaybody"></pre></div></div>
<script id="data" type="application/json">/*ARBITER_DATA*/</script>
<script>
const DATA = JSON.parse(document.getElementById("data").textContent);
const el = (tag, cls, text) => {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined) node.textContent = text;
  return node;
};
const ruleMeta = name => DATA.rules.find(r => r.name === name);
let pending = null;
let cy = null;

// ---- the containment tree, derived once ----
// Every known place in repo coordinates, with its owning unit; children are
// derived from path chains so single-child corridors stay walkable.
const UNITS = DATA.unitsList.filter(u => !u.test).map(u => u.name);
const ownerOf = place => {
  if (UNITS.includes(place)) return place;
  let best = ".";
  for (const u of UNITS) if (u !== "." && (place === u || place.startsWith(u + "/")) && u.length > best.length) best = u;
  return best;
};
const fullOf = (unit, child) => unit === "." ? child : unit + "/" + child;
const CHILDREN = { units: new Set() };
const register = place => {
  const unit = ownerOf(place);
  CHILDREN.units.add(unit);
  if (place === unit) return;
  const rel = unit === "." ? place : place.slice(unit.length + 1);
  const parts = rel.split("/");
  let parent = unit;
  for (const part of parts) {
    const child = parent === "." ? part : parent + "/" + part;
    (CHILDREN[parent] = CHILDREN[parent] || new Set()).add(child);
    parent = child;
  }
};
for (const u of UNITS) CHILDREN.units.add(u);
for (const fam of DATA.families) {
  register(fam.place);
  for (const e of fam.edges) { register(fullOf(fam.unit, e.from)); register(fullOf(fam.unit, e.to)); }
}
for (const t of DATA.tangles) { register(t.place); for (const m of t.members) register(fullOf(ownerOf(t.place), m)); }
for (const e of DATA.edges) { CHILDREN.units.add(e.user); CHILDREN.units.add(e.owner); }
const childrenOf = scope => [...(CHILDREN[scope] || new Set())].sort();
const within = (f, place) =>
  !place || place === "." || f.file === place || f.file.startsWith(place + "/");
const findingsUnder = place => DATA.findings.filter(f => within(f, place));
const outcomesOf = unit => DATA.outcomes.filter(o => o.unit === unit);

// ---- header ----
{
  const failed = DATA.outcomes.filter(o => !o.passed).length;
  const verdict = document.getElementById("verdict");
  verdict.appendChild(failed === 0 && DATA.findings.length === 0
    ? el("span", "good", "clean — " + DATA.outcomes.length + " checks, no findings")
    : el("span", "bad", failed + " checks failed, " + DATA.findings.length + " findings"));
  document.getElementById("meta").textContent =
    DATA.root + " · arbiter " + DATA.version + " · " + DATA.units + " units, " + DATA.files + " files";
}

// ---- routing ----
const TABS = [
  ["overview", () => DATA.findings.length, () => DATA.findings.length > 0],
  ["findings", () => DATA.findings.length, () => DATA.findings.length > 0],
  ["graph", () => DATA.edges.length + DATA.families.length, () => DATA.tangles.length > 0],
  ["plans", () => DATA.plans.plans.length, () => false],
  ["brief", () => DATA.brief ? DATA.brief.cases : 0, () => false],
  ["ledger", () => DATA.suppressions.counted.length, () => false],
  ["rules", () => DATA.rules.length, () => false],
];
function route() {
  const hash = decodeURIComponent(location.hash.slice(1)) || "overview";
  const [tab, ...rest] = hash.split("/");
  const nav = document.getElementById("nav");
  nav.textContent = "";
  for (const [name, count, alarmed] of TABS) {
    const a = el("a", name === tab ? "on" : null);
    a.href = "#" + name;
    a.appendChild(el("b", null, name));
    a.appendChild(el("span", alarmed() ? "bad" : null, " " + count()));
    nav.appendChild(a);
  }
  lastScope = null;
  closePanel();
  const view = document.getElementById("view");
  view.textContent = "";
  cy = null;
  ({ overview, findings, graph, plans, brief, ledger, rules }[tab] || overview)(view, rest.join("/"));
}
window.addEventListener("hashchange", route);
function go(hash) {
  if (location.hash === "#" + hash) route();
  else location.hash = "#" + hash;
}

// ---- panel & overlay ----
function openPanel(title, kind, build) {
  const panel = document.getElementById("panel");
  panel.textContent = "";
  panel.className = "open";
  const close = el("span", "close", "x");
  close.onclick = closePanel;
  panel.appendChild(close);
  panel.appendChild(el("h3", null, title));
  panel.appendChild(el("div", "kind", kind));
  build(panel);
}
function closePanel() {
  const panel = document.getElementById("panel");
  panel.className = ""; panel.textContent = "";
  unglow();
  const reopen = document.getElementById("reopen");
  reopen.className = lastScope === null ? "" : "show";
}
let lastScope = null;
document.getElementById("reopen").onclick = () => { if (lastScope !== null) scopePanel(lastScope); };
let scopeFacts = { nodes: 0, edges: 0, tangle: null };
function scopePanel(scope) {
  lastScope = scope;
  document.getElementById("reopen").className = "";
  const title = scope === "units" ? "units — the whole quotient" : scope;
  openPanel(title, "scope — tap a node to drill, the void to come back", panel => {
    panel.appendChild(el("div", "row dim", scopeFacts.nodes + " nodes, " + scopeFacts.edges + " edges"));
    if (scope !== "units") {
      const unit = ownerOf(scope);
      const declared = DATA.declared.find(d => d.name === unit);
      const rel = unit === "." ? scope : scope === unit ? "" : scope.slice(unit.length + 1);
      const inner = declared && rel && declared.inner.find(i => i.path === rel);
      const intent = scope === unit ? declared : inner;
      if (intent) {
        panelList(panel, "deps (intent)", intent.deps.length ? intent.deps : ["(undeclared)"]);
        panelList(panel, "visibility (intent)", intent.visibility.length ? intent.visibility : ["(undeclared)"]);
      } else {
        panel.appendChild(el("h4", null, "intent"));
        panel.appendChild(el("div", "row dim", "(nothing declared — binds nothing)"));
      }
    }
    if (scopeFacts.tangle) {
      const line = el("div", "row bad", "tangle: " + scopeFacts.tangle.members.join(" <-> "));
      line.style.cursor = "pointer";
      const owner = ownerOf(scope === "units" ? "." : scope);
      line.onmouseenter = () => glowMembers(scopeFacts.tangle.members.map(m => fullOf(owner, m)));
      line.onmouseleave = unglow;
      panel.appendChild(el("h4", null, "tangle"));
      panel.appendChild(line);
    }
    const mine = scope === "units" ? DATA.findings : findingsUnder(scope);
    panelFindings(panel, mine.slice(0, 12), scope === "units" ? "" : scope);
    if (mine.length > 12) {
      const more = el("a", null, mine.length - 12 + " more in findings ↗");
      more.onclick = () => go("findings" + (scope === "units" ? "" : "/" + scope));
      panel.appendChild(more);
    }
  });
}
function panelList(panel, title, items, each) {
  if (!items || !items.length) return;
  panel.appendChild(el("h4", null, title));
  for (const item of items) {
    const row = el("div", "row" + (each ? " link" : ""), typeof item === "string" ? item : item.text);
    if (each) {
      const target = typeof item === "string" ? item : item.target;
      row.onmouseenter = () => glow(target);
      row.onmouseleave = unglow;
      row.onclick = () => each(target);
    }
    panel.appendChild(row);
  }
}
function panelFindings(panel, mine, place) {
  panel.appendChild(el("h4", null, "findings " + mine.length));
  if (!mine.length) { panel.appendChild(el("div", "row dim", "none")); return; }
  if (place !== undefined) {
    const all = el("a", null, "open in findings ↗");
    all.onclick = () => go("findings" + (place ? "/" + place : ""));
    panel.appendChild(all);
  }
  for (const f of mine.slice(0, 10)) panel.appendChild(findingRow(f, hoverFor(f)));
  if (mine.length > 10) {
    const more = el("a", null, mine.length - 10 + " more in findings ↗");
    more.onclick = () => go("findings" + (place ? "/" + place : ""));
    panel.appendChild(more);
  }
}
// A finding that names a tangle isolates it on hover, wherever it is shown.
function hoverFor(f) {
  if (f.rule !== "sibling-cycle") return null;
  const tangle = DATA.tangles.find(t => t.place === f.file);
  if (!tangle) return null;
  const owner = ownerOf(f.file);
  return () => glowMembers(tangle.members.map(m => fullOf(owner, m)));
}
function showOverlay(title, body) {
  document.getElementById("overlaytitle").textContent = title;
  document.getElementById("overlaybody").textContent = body;
  document.getElementById("overlay").className = "open";
}
function closeOverlay() { document.getElementById("overlay").className = ""; }
document.getElementById("overlay").onclick = e => { if (e.target.id === "overlay") closeOverlay(); };

// ---- the graph (cytoscape + dagre) ----
function glow(place) {
  if (!cy) return;
  const node = cy.getElementById(place);
  if (!node.length) return;
  cy.elements().addClass("faded");
  node.removeClass("faded").addClass("glow");
  node.connectedEdges().removeClass("faded").addClass("glow");
  node.connectedEdges().connectedNodes().removeClass("faded");
}
function glowMembers(places) {
  if (!cy) return;
  cy.elements().addClass("faded");
  for (const p of places) {
    const node = cy.getElementById(p);
    node.removeClass("faded").addClass("glow");
    node.connectedEdges().filter(e => places.includes(e.source().id()) && places.includes(e.target().id()))
      .removeClass("faded").addClass("glow");
  }
}
function unglow() { if (cy) cy.elements().removeClass("faded glow"); }

function graph(view, scope) {
  scope = scope || "units";
  const crumbs = el("div", "crumbs");
  const link = (label, target) => {
    const a = el("a", null, label);
    a.onclick = () => go("graph/" + target);
    crumbs.appendChild(a);
  };
  link("units", "units");
  if (scope !== "units") {
    const unit = ownerOf(scope);
    crumbs.appendChild(el("span", null, "  /  "));
    link(unit, unit);
    if (scope !== unit) {
      const rel = unit === "." ? scope : scope.slice(unit.length + 1);
      let walked = unit;
      rel.split("/").forEach(part => {
        walked = walked === "." ? part : walked + "/" + part;
        crumbs.appendChild(el("span", null, " / "));
        link(part, walked);
      });
    }
  }
  view.appendChild(crumbs);

  let nodes = [], edges = [], tangleMembers = new Set();
  if (scope === "units") {
    nodes = childrenOf("units");
    if (UNITS.length > 1) nodes = nodes.filter(n => n !== ".");
    edges = DATA.edges.map(e => ({ from: e.user, to: e.owner, breaks: e.breaks }));
  } else {
    nodes = childrenOf(scope);
    const unit = ownerOf(scope);
    const fam = DATA.families.find(f => f.place === scope);
    if (fam) edges = fam.edges.map(e => ({ from: fullOf(fam.unit, e.from), to: fullOf(fam.unit, e.to) }));
    const tangle = DATA.tangles.find(t => t.place === scope);
    if (tangle) tangleMembers = new Set(tangle.members.map(m => fullOf(unit, m)));
  }
  for (const e of edges) { if (!nodes.includes(e.from)) nodes.push(e.from); if (!nodes.includes(e.to)) nodes.push(e.to); }

  const holder = el("div"); holder.id = "cy";
  view.appendChild(holder);
  if (!nodes.length) holder.replaceWith(el("div", "empty", "nothing resolved here"));
  else if (!window.cytoscape) {
    const card = el("div", "card");
    card.appendChild(el("div", "warn", "graph library unreachable (offline?) — the edges, listed:"));
    edges.forEach(e => card.appendChild(el("div", e.breaks ? "bad" : "dim", e.from + " -> " + e.to)));
    holder.replaceWith(card);
  } else {
    const lerp = (a, b, t) => {
      const hex = c => [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16));
      const [ar, ag, ab] = hex(a), [br, bg, bb] = hex(b);
      const mix = (x, y) => Math.round(x + (y - x) * t).toString(16).padStart(2, "0");
      return "#" + mix(ar, br) + mix(ag, bg) + mix(ab, bb);
    };
    const SOURCE = "#27405e", SINK = "#45335e", LONE = "#1d242e";
    const degree = {};
    for (const n of nodes) degree[n] = { incoming: 0, outgoing: 0 };
    for (const e of edges) {
      if (degree[e.from]) degree[e.from].outgoing++;
      if (degree[e.to]) degree[e.to].incoming++;
    }
    const flow = n => {
      const d = degree[n];
      if (!d || (!d.incoming && !d.outgoing)) return LONE;
      return lerp(SOURCE, SINK, d.incoming / (d.incoming + d.outgoing));
    };
    const label = place => {
      const short = place === "." ? "." : place.split("/").pop();
      const alarms = findingsUnder(place).length;
      return short + (alarms ? "  ●" + alarms : "");
    };
    const stageClass = place => {
      const outs = outcomesOf(place);
      if (!outs.length) return "";
      return outs.some(o => !o.passed) ? " stagefail" : " stageok";
    };
    const elements = [];
    for (const n of nodes) elements.push({ data: { id: n, label: label(n), flow: flow(n) },
      classes: (tangleMembers.has(n) ? "tangled " : "") + (findingsUnder(n).length ? "alarmed" : "")
        + stageClass(n) + (childrenOf(n).length || DATA.families.some(f => f.place === n) ? " enterable" : "") });
    edges.forEach((e, i) => elements.push({

function placePanel(place) {

// ---- jumping from a finding to its place ----
function findingRow(f, hover) {
  const node = el("div", "finding");
  node.appendChild(el("div", "bad", f.rule));
  node.appendChild(el("div", null, f.reason));
  const where = el("div", "where");
  where.appendChild(document.createTextNode(f.file + (f.line ? ":" + f.line : "") + "  "));
  where.appendChild(el("span", "tag id", f.id));
  where.appendChild(el("span", "go", "  ↗ see it"));
  node.appendChild(where);
  node.onclick = () => jump(f);
  if (hover) { node.onmouseenter = hover; node.onmouseleave = unglow; }
  return node;
}

function jump(f) {
  const planRules = new Set(["phantom-service", "boot-cycle", "undeclared-volume", "unbacked-volume",
    "unplanned-service", "overcommitted-machine", "uninvited-channel", "stale-channel-grant", "unbuilt-artifact"]);
  if (planRules.has(f.rule)) {
    const service = DATA.plans.services.find(s => s.line === f.line);
    pending = { service: service && service.name };
    go("plans");
    return;
  }
  if (f.rule === "sibling-cycle") {
    const tangle = DATA.tangles.find(t => t.place === f.file);
    pending = { members: tangle ? tangle.members : [] };
    go("graph/" + f.file);
    return;
  }
  if (CHILDREN[f.file] || DATA.families.some(fam => fam.place === f.file)) { go("graph/" + f.file); return; }
  const dir = f.file.includes("/") ? f.file.slice(0, f.file.lastIndexOf("/")) : ".";
  if (CHILDREN[dir] || DATA.families.some(fam => fam.place === dir)) {
    pending = { select: f.file };
    go("graph/" + dir);
    return;
  }
  pending = { select: ownerOf(f.file) };
  go("graph/units");
}

// ---- the pipeline: how a run flows, told with this run's numbers ----
function pipeline(view) {
  const box = el("div"); box.id = "pipe";
  const failed = DATA.outcomes.filter(o => !o.passed).length;
  const dials = DATA.findings.filter(f => f.check === "ecosystem-dials").length;
  const contracts = DATA.outcomes.filter(o =>
    o.check === "stale-generated" || o.check === "inter-language-break");
  const checks = [...new Set(DATA.outcomes.map(o => o.check))].sort();
  const unanswered = DATA.brief ? DATA.brief.needs.filter(n => n.state === "unanswered").length : 0;
  const timed = name => {
    const step = (DATA.pipeline || []).find(s => s.name === name);
    if (!step) return "";
    return " · " + (step.seconds < 0.05 ? "<0.1s" : step.seconds.toFixed(1) + "s");
  };
  const contractSeconds = contracts.filter(o => !o.warm).reduce((sum, o) => sum + o.seconds, 0);
  const steps = [
    { name: "scan", sub: DATA.units + " units, " + DATA.files + " files" + timed("scan"), cls: "green" },
    { name: "resolve", sub: DATA.resolved + " edges" + timed("resolve"), cls: "green" },
    { name: "judge", sub: DATA.findings.length + " findings" + timed("judge"),
      cls: DATA.findings.length ? "red" : "green", act: () => go("findings") },
    { name: "dials", sub: dials + " findings · with tools", cls: dials ? "red" : "green" },
    { name: "tools", sub: (checks.join(" ") || "—") + timed("tools"), cls: failed ? "red" : "green",
      act: () => scrollTo("outcomesbox") },
    { name: "contracts", sub: contracts.length
        ? contracts.length + " checked · " + contractSeconds.toFixed(1) + "s" : "none here",
      cls: contracts.some(o => !o.passed) ? "red" : "green" },
    { name: "claims", sub: DATA.claims + " heard" + timed("claims"), cls: unanswered ? "red" : "green",
      act: () => go("brief") },
    { name: "ledger", sub: DATA.suppressions.counted.length + " counted" + timed("ledger"),
      cls: "green", act: () => go("ledger") },
  ];
  const stepw = s => Math.max(96, s.name.length * 8 + 30, s.sub.length * 6.4 + 24);
  const gap = 44, h = 46, pad = 14;
  let x = pad;
  const places = steps.map(s => { const at = x; x += stepw(s) + gap; return at; });
  const svg = svgel("svg", { width: x + pad, height: h + 42 });
  const defs = svgel("defs", {});
  const marker = svgel("marker", { id: "parrow", viewBox: "0 0 10 10", refX: 9, refY: 5,
    markerWidth: 6, markerHeight: 6, orient: "auto" });
  marker.appendChild(svgel("path", { d: "M 0 0 L 10 5 L 0 10 z", fill: "#8b95a3" }));
  defs.appendChild(marker);
  svg.appendChild(defs);
  steps.forEach((s, i) => {
    if (i) svg.appendChild(svgel("path", { class: "flow",
      d: `M ${places[i - 1] + stepw(steps[i - 1])} ${pad + h / 2} L ${places[i] - 4} ${pad + h / 2}` }));
    const g = svgel("g", { class: "step " + s.cls });
    g.appendChild(svgel("rect", { x: places[i], y: pad, width: stepw(s), height: h }));
    const label = svgel("text", { x: places[i] + 12, y: pad + 19 });
    label.textContent = s.name;
    g.appendChild(label);
    const sub = svgel("text", { x: places[i] + 12, y: pad + 35, class: "sub" });
    sub.textContent = s.sub;
    g.appendChild(sub);
    if (s.act) g.onclick = s.act;
    svg.appendChild(g);
  });
  box.appendChild(svg);
  view.appendChild(box);
}
function scrollTo(id) {
  const target = document.getElementById(id);
  if (target) target.scrollIntoView({ behavior: "smooth", block: "start" });
}

// ---- findings: the one home, filterable, scope-aware ----
function findings(view, scope) {
  const hold = el("div"); hold.id = "filterbar";
  const bar = el("div", "card");
  bar.style.display = "flex"; bar.style.gap = "1rem"; bar.style.flexWrap = "wrap";
  const scopeIn = document.createElement("input");
  scopeIn.placeholder = "scope — a unit, folder or file; empty is everything";
  scopeIn.value = scope || "";
  scopeIn.setAttribute("list", "scopelist");
  const suggestions = document.createElement("datalist");
  suggestions.id = "scopelist";
  const places = [...new Set([
    ...Object.keys(CHILDREN).filter(k => k !== "units"),
    ...[].concat(...Object.values(CHILDREN).map(s => [...s])),
  ])];
  const depth = p => p.split("/").length;
  const suggest = () => {
    suggestions.textContent = "";
    const typed = scopeIn.value.trim();
    const pool = typed
      ? places.filter(p => p.startsWith(typed) && p !== typed)
      : UNITS.slice();
    pool.sort((a, b) => depth(a) - depth(b) || a.localeCompare(b));
    for (const p of pool.slice(0, 40)) {
      const option = document.createElement("option");
      option.value = p;
      suggestions.appendChild(option);
    }
  };
  suggest();
  bar.appendChild(suggestions);
  const ruleIn = document.createElement("select");
  const opt = (v, label) => { const o = document.createElement("option"); o.value = v; o.textContent = label; ruleIn.appendChild(o); };
  opt("", "every rule");
  [...new Set(DATA.findings.map(f => f.rule))].sort().forEach(r =>
    opt(r, r + " (" + DATA.findings.filter(f => f.rule === r).length + ")"));
  const textIn = document.createElement("input");
  textIn.placeholder = "search reasons and ids";
  for (const input of [scopeIn, textIn]) {
    input.style.cssText = "background:#10141a;border:1px solid #272f3b;border-radius:4px;color:#d9dfe7;font:inherit;padding:.25rem .5rem;flex:1;min-width:180px";
  }
  ruleIn.style.cssText = "background:#10141a;border:1px solid #272f3b;border-radius:4px;color:#d9dfe7;font:inherit;padding:.25rem .5rem";
  bar.append(scopeIn, ruleIn, textIn);
  hold.appendChild(bar);
  view.appendChild(hold);
  const count = el("div", "legend");
  view.appendChild(count);
  const box = el("div");
  view.appendChild(box);
  const render = () => {
    box.textContent = "";
    const at = scopeIn.value.trim();
    const needle = textIn.value.trim().toLowerCase();
    const mine = DATA.findings.filter(f =>
      within(f, at)
      && (!ruleIn.value || f.rule === ruleIn.value)
      && (!needle || f.reason.toLowerCase().includes(needle) || f.id.includes(needle)));
    count.textContent = mine.length + " of " + DATA.findings.length + " findings"
      + (at ? " under " + at : "") + " — click one to see it in place";
    docketInto(box, mine, true);
  };
  ruleIn.onchange = textIn.oninput = render;
  scopeIn.oninput = () => { suggest(); render(); };
  render();
}
function docketInto(box, list, openAll) {
  if (!list.length) {
    const card = el("div", "card");
    card.appendChild(el("div", "empty", "nothing here — the docket is empty at this scope"));
    box.appendChild(card);
    return;
  }
  const byRule = {};
  for (const f of list) (byRule[f.rule] = byRule[f.rule] || []).push(f);
  for (const rule of Object.keys(byRule).sort()) {
    const group = el("details", "group");
    if (openAll || Object.keys(byRule).length <= 2) group.open = true;
    const summary = el("summary");
    summary.appendChild(el("b", "bad", rule));
    summary.appendChild(el("span", "hint", String(byRule[rule].length)));
    const meta = ruleMeta(rule);
    if (meta) {
      if (meta.core) summary.appendChild(el("span", "tag core", "core"));
      summary.appendChild(el("span", "tag" + (meta.record ? " record" : ""), meta.record ? "record" : "facts"));
    }
    group.appendChild(summary);
    const body = el("div", "body");
    if (meta) body.appendChild(el("div", "law", meta.law));
    for (const f of byRule[rule]) body.appendChild(findingRow(f));
    group.appendChild(body);
    box.appendChild(group);
  }
}

// ---- plans (the board) ----
const svgel = (tag, attrs) => {
  const node = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const k in attrs) node.setAttribute(k, attrs[k]);
  return node;
};
function plans(view) {
  const data = DATA.plans;
  if (!data.services.length) {
    view.appendChild(el("div", "empty", "no plans written — the record is .arbiter/plans.toml"));
    return;
  }
  const chosen = (pending && pending.plan) || (data.plans[0] && data.plans[0].name);
  if (data.plans.length > 1) {
    const pick = el("div", "planpick");
    for (const plan of data.plans) {
      const a = el("a", plan.name === chosen ? "on" : null, "plan " + plan.name);
      a.onclick = () => { pending = { plan: plan.name }; route(); };
      pick.appendChild(a);
    }
    view.appendChild(pick);
  }
  const plan = data.plans.find(p => p.name === chosen);
  if (plan) planBoard(view, plan);
  else view.appendChild(el("div", "empty", "services declared, no plan written yet"));
  const placedNames = new Set(plan ? plan.ladder.flat().map(s => s.service) : []);
  const loose = data.services.filter(s => !placedNames.has(s.name));
  if (loose.length) {
    const card = el("div", "card");
    card.appendChild(el("span", "dim", "not in this plan: "));
    loose.forEach(s => {
      const a = el("a", "warn", s.name + "  ");
      a.style.cursor = "pointer";
      a.onclick = () => servicePanel(s.name);
      card.appendChild(a);
    });
    view.appendChild(card);
  }
  const selected = pending && pending.service;
  pending = null;
  if (selected) servicePanel(selected);
}
function planBoard(view, plan) {
  const data = DATA.plans;
  const machines = [...new Set(plan.ladder.flat().map(s => s.machine))].sort();
  const colw = 190, rowh = 92, padd = 56, nodeh = 32, top = 70;
  const pos = {};
  plan.ladder.forEach((rung, r) => {
    const stacked = {};
    rung.forEach(s => {
      const col = machines.indexOf(s.machine);
      const stack = (stacked[s.machine] = stacked[s.machine] || 0);
      pos[s.service] = { x: padd + col * colw + 12 + stack * 10, y: top + r * rowh, meta: s };
      stacked[s.machine]++;
    });
  });
  const width = padd * 2 + machines.length * colw;
  const height = top + plan.ladder.length * rowh + 30;
  const svg = svgel("svg", { width: Math.max(width, 420), height, class: "board" });
  const defs = svgel("defs", {});
  const marker = svgel("marker", { id: "arrow", viewBox: "0 0 10 10", refX: 9, refY: 5,
    markerWidth: 7, markerHeight: 7, orient: "auto-start-reverse" });
  marker.appendChild(svgel("path", { d: "M 0 0 L 10 5 L 0 10 z", fill: "#8b95a3" }));
  defs.appendChild(marker);
  svg.appendChild(defs);
  machines.forEach((machine, col) => {
    svg.appendChild(svgel("rect", { x: padd + col * colw, y: top - 28,
      width: colw - 22, height: plan.ladder.length * rowh + 28, class: "machinebox" }));
    const label = svgel("text", { x: padd + col * colw + 8, y: top - 36, class: "machinelabel" });
    const spec = data.machines.find(m => m.name === machine);
    label.textContent = machine + (spec && spec.cpu ? "  cpu " + spec.cpu : "")
      + (spec && spec.memory_mb ? "  mem " + spec.memory_mb : "");
    svg.appendChild(label);
  });
  plan.ladder.forEach((_, r) => {
    const label = svgel("text", { x: 8, y: top + r * rowh + 20, class: "runglabel" });
    label.textContent = "up " + (r + 1);
    svg.appendChild(label);
  });
  for (const service of data.services) {
    for (const need of service.needs) {
      const a = pos[service.name], b = pos[need];
      if (!a || !b) continue;
      svg.appendChild(svgel("path", { class: "edge",
        d: `M ${a.x + 70} ${a.y + nodeh} C ${a.x + 70} ${a.y + nodeh + 26}, ${b.x + 70} ${b.y - 26}, ${b.x + 70} ${b.y - 2}` }));
    }
  }
  for (const c of data.channels) {
    const a = pos[c.from], b = pos[c.to];
    if (!a || !b) continue;
    svg.appendChild(svgel("path", { class: "edge channel",
      d: `M ${a.x + 110} ${a.y + nodeh / 2} C ${(a.x + b.x) / 2 + 100} ${a.y}, ${(a.x + b.x) / 2 + 100} ${b.y}, ${b.x + 110} ${b.y + nodeh / 2}` }));
  }
  for (const d of data.doors) {
    const b = pos[d.via] || pos[d.to];
    if (!b) continue;
    const label = svgel("text", { x: b.x, y: 22, class: "worldlabel" });
    label.textContent = d.domain + ":" + d.port + " ->";
    svg.appendChild(label);
    svg.appendChild(svgel("path", { class: "edge door", d: `M ${b.x + 70} 28 L ${b.x + 70} ${b.y - 4}` }));
  }
  for (const name in pos) {
    const p = pos[name];
    const group = svgel("g", { class: "node" });
    group.appendChild(svgel("rect", { x: p.x, y: p.y, width: 140, height: nodeh }));
    const label = svgel("text", { x: p.x + 10, y: p.y + 20 });
    label.textContent = name + (p.meta.replicas > 1 ? " x" + p.meta.replicas : "");
    group.appendChild(label);
    group.onclick = () => servicePanel(name);
    svg.appendChild(group);
  }
  view.appendChild(svg);
}
function servicePanel(name) {
  const service = DATA.plans.services.find(s => s.name === name);
  if (!service) return;
  openPanel(name, "service" + (service.replicas > 1 ? " x" + service.replicas : ""), panel => {
    if (service.unit) {
      panel.appendChild(el("h4", null, "built by"));
      const a = el("a", null, "unit " + service.unit + " — open its graph");
      a.onclick = () => { pending = { select: service.unit }; go("graph/units"); };
      panel.appendChild(a);
    } else { panel.appendChild(el("h4", null, "built by")); panel.appendChild(el("div", "row dim", "(external artifact)")); }
    panelList(panel, "resources", [
      "cpu " + (service.cpu == null ? "unstated" : service.cpu),
      "memory_mb " + (service.memory_mb == null ? "unstated" : service.memory_mb)]);
    panelList(panel, "needs (construction)", service.needs.length ? service.needs : ["none"]);
    panelList(panel, "channels (association)",
      DATA.plans.channels.filter(c => c.from === name).map(c => "-> " + c.to + (c.contract ? "  " + c.contract : "")));
    panelList(panel, "accepts", service.accepts == null ? ["(absent — invites everyone)"] : service.accepts);
    panelList(panel, "volumes", service.volumes.map(v => {
      const vol = DATA.plans.volumes.find(x => x.name === v);
      return v + (vol && vol.backup ? "  backup " + vol.backup : vol ? "  (unbacked)" : "  (undeclared)");
    }));
    panelList(panel, "doors", DATA.plans.doors.filter(d => d.via === name)
      .map(d => d.domain + ":" + d.port + " -> " + d.to));
    panelFindings(panel, DATA.findings.filter(f => f.file.endsWith("plans.toml") && f.line === service.line), ".arbiter/plans.toml");
  });
}

// ---- brief, ledger, rules ----
function brief(view) {
  if (!DATA.brief) { view.appendChild(el("div", "empty", "no brief written")); return; }
  const byCase = {};
  for (const need of DATA.brief.needs) (byCase[need.case] = byCase[need.case] || []).push(need);
  for (const name of Object.keys(byCase)) {
    const card = el("div", "card");
    card.appendChild(el("b", null, name));
    for (const need of byCase[name]) {
      const row = el("div");
      row.appendChild(el("span", "state-" + need.state, need.state.padEnd(11)));
      row.appendChild(document.createTextNode(need.need));
      card.appendChild(row);
    }
    view.appendChild(card);
  }
}
function ledger(view) {
  const s = DATA.suppressions;
  const summary = el("div", "card");
  summary.appendChild(el("div", null, s.counted.length + " suppressions counted" +
    (s.added === null ? " — no reference recorded: nothing is signed yet" :
      ", " + s.added + " added since the signature")));
  summary.appendChild(el("div", "dim", "every entry is a user decision: one rule quieted, one place, counted forever."));
  view.appendChild(summary);
  const byFile = {};
  for (const entry of s.counted) (byFile[entry.file] = byFile[entry.file] || []).push(entry);
  for (const file of Object.keys(byFile).sort()) {
    const group = el("details", "group");
    const summary = el("summary");
    summary.appendChild(el("b", null, file));
    summary.appendChild(el("span", "dim", String(byFile[file].length)));
    group.appendChild(summary);
    const body = el("div", "body");
    const table = el("table");
    for (const entry of byFile[file]) {
      const row = el("tr");
      row.appendChild(el("td", "dim", entry.line ? "line " + entry.line : ""));
      row.appendChild(el("td", null, entry.text));
      table.appendChild(row);
    }
    body.appendChild(table);
    group.appendChild(body);
    view.appendChild(group);
  }
  const third = el("div", "card");
  third.appendChild(el("div", null, DATA.third.locked + " third parties locked" +
    (DATA.third.added === null ? ", no reference recorded" : ", " + DATA.third.added + " added since the signature")));
  view.appendChild(third);
}
function rules(view) {
  const card = el("div", "card");
  const table = el("table");
  const head = el("tr");
  for (const h of ["rule", "power", "group", "law"]) head.appendChild(el("th", null, h));
  table.appendChild(head);
  for (const r of DATA.rules) {
    const row = el("tr");
    row.appendChild(el("td", null, r.name));
    row.appendChild(el("td", r.record ? "warn" : "dim", (r.core ? "core, " : "") + (r.record ? "record" : "facts")));
    row.appendChild(el("td", "dim", r.group));
    row.appendChild(el("td", "law", r.law));
    table.appendChild(row);
  }
  card.appendChild(table);
  view.appendChild(card);
}

route();
</script>
