[package]
name = "arbiter"
version = "0.0.1"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
streaming-iterator = "0.1"
task_runner = { path = "../task_runner" }
toml = "0.8"
tree-sitter = "0.25"
tree-sitter-cpp = "0.23"
tree-sitter-proto = "0.6.0"
tree-sitter-python = "0.23"
