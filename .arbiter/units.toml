# The unit graph, declared. The gate holds the resolved imports to this file
# one unit at a time: a unit absent here is unchecked, so adopt at your pace.
#
# [units."libs/example"]
# # Who may import this unit: exact paths, a folder and below as "apps/*", or "*".
# visibility = ["apps/*"]
# # The units this one uses, held both ways: using an undeclared unit is a
# # finding, and so is declaring one never used.
# deps = ["libs/other"]

[units.".".inner."src/core"]
deps = []

[units.".".inner."src/packs"]
deps = ["src/core"]

[units.".".inner."src/records"]
deps = ["src/core"]

[units.".".inner."src/laws"]
deps = ["src/core", "src/records", "src/ledger.rs"]


[units.".".inner."src/examine.rs"]
deps = ["src/core", "src/records"]

[units.".".inner."src/ledger.rs"]
deps = ["src/core"]

[units.".".inner."src/gate"]
deps = ["src/core", "src/records", "src/laws", "src/ledger.rs", "src/packs"]

[units.".".inner."src/court"]
deps = ["src/core", "src/records", "src/laws", "src/ledger.rs", "src/gate", "src/packs"]

[units.".".inner."src/tasks"]
deps = ["src/core", "src/records", "src/packs"]

[units.".".inner."src/commands"]
deps = [
  "src/core",
  "src/records",
  "src/laws",
  "src/examine.rs",
  "src/ledger.rs",
  "src/gate",
  "src/court",
  "src/packs",
  "src/tasks",
]
