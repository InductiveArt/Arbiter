# The unit graph, declared. The gate holds the resolved imports to this file
# one unit at a time: a unit absent here is unchecked, so adopt at your pace.
#
# [units."libs/example"]
# # Who may import this unit: exact paths, a folder and below as "apps/*", or "*".
# visibility = ["apps/*"]
# # The units this one uses, held both ways: using an undeclared unit is a
# # finding, and so is declaring one never used.
# deps = ["libs/other"]

[units."arbiter".inner."src/core"]
deps = []

[units."arbiter".inner."src/packs"]
deps = ["src/core"]

[units."arbiter".inner."src/tasks/laws"]
deps = ["src/core", "src/ledger.rs"]


[units."arbiter".inner."src/ledger.rs"]
deps = ["src/core"]

[units."arbiter".inner."src/gate"]
deps = ["src/core", "src/tasks", "src/tasks/laws", "src/ledger.rs", "src/packs"]

[units."arbiter".inner."src/court"]
deps = ["src/core", "src/tasks/laws", "src/ledger.rs", "src/gate", "src/packs"]

[units."arbiter".inner."src/tasks"]
deps = ["src/core", "src/ledger.rs", "src/packs"]

[units."arbiter".inner."src/commands"]
deps = [
  "src/core",
  "src/tasks/laws",
  "src/ledger.rs",
  "src/gate",
  "src/court",
  "src/packs",
  "src/tasks",
  "src/wip_domain",
  "src/wip_tasks",
  "//task_runner/src/store.rs",
  "//task_runner/src/task.rs",
]

[units."arbiter".inner."src/wip_domain"]
deps = []

[units."arbiter".inner."src/wip_tasks"]
deps = [
  "src/core",
  "src/wip_domain",
  "//task_runner/src/job",
  "//task_runner/src/run",
  "//task_runner/src/trace",
  "//task_runner/src/layout.rs",
  "//task_runner/src/plan.rs",
  "//task_runner/src/pull.rs",
  "//task_runner/src/scope.rs",
  "//task_runner/src/store.rs",
  "//task_runner/src/task.rs",
]

[units."task_runner".inner."src"]
deps = []

[units."task_runner".inner."src/job"]
deps = []

[units."task_runner".inner."src/trace"]
deps = ["src/job"]

[units."task_runner".inner."src/kernel"]
deps = ["src/trace"]

[units."task_runner".inner."src/layout.rs"]
deps = []

[units."task_runner".inner."src/scope.rs"]
deps = ["src/job", "src/kernel", "src/trace", "src/layout.rs"]

[units."task_runner".inner."src/store.rs"]
deps = ["src/job", "src/trace"]

[units."task_runner".inner."src/pull.rs"]
deps = ["src/job", "src/trace", "src/store.rs"]

[units."task_runner".inner."src/task.rs"]
deps = [
  "src/job",
  "src/trace",
  "src/layout.rs",
  "src/pull.rs",
  "src/scope.rs",
  "src/store.rs",
]

[units."task_runner".inner."src/plan.rs"]
deps = ["src/trace", "src/pull.rs", "src/scope.rs", "src/store.rs", "src/task.rs"]

[units."task_runner".inner."src/worker.rs"]
deps = [
  "src/job",
  "src/kernel",
  "src/trace",
  "src/layout.rs",
  "src/pull.rs",
  "src/scope.rs",
  "src/store.rs",
  "src/task.rs",
]

[units."task_runner".inner."src/run"]
deps = [
  "src/job",
  "src/kernel",
  "src/trace",
  "src/layout.rs",
  "src/plan.rs",
  "src/pull.rs",
  "src/scope.rs",
  "src/store.rs",
  "src/task.rs",
  "src/worker.rs",
]

[units."task_runner".inner."src/exhibit"]
deps = [
  "src/trace",
  "src/run",
  "src/plan.rs",
  "src/pull.rs",
  "src/scope.rs",
  "src/store.rs",
  "src/task.rs",
]

[units."task_runner".inner."src/registry.rs"]
deps = ["src/exhibit", "src/task.rs"]
