# The unit graph, declared. The gate holds the resolved imports to this file
# one unit at a time: a unit absent here is unchecked, so adopt at your pace.
#
# [units."libs/example"]
# # Who may import this unit: exact paths, a folder and below as "apps/*", or "*".
# visibility = ["apps/*"]
# # The units this one uses, held both ways: using an undeclared unit is a
# # finding, and so is declaring one never used.
# deps = ["libs/other"]

[units.".".inner."src/core"]
deps = []

[units.".".inner."src/packs"]
deps = ["src/core"]

[units.".".inner."src/tasks/laws"]
deps = ["src/core", "src/ledger.rs"]


[units.".".inner."src/ledger.rs"]
deps = ["src/core"]

[units.".".inner."src/gate"]
deps = ["src/core", "src/tasks", "src/tasks/laws", "src/ledger.rs", "src/packs"]

[units.".".inner."src/court"]
deps = ["src/core", "src/tasks/laws", "src/ledger.rs", "src/gate", "src/packs"]

[units.".".inner."src/tasks"]
deps = ["src/core", "src/ledger.rs", "src/packs"]

[units.".".inner."src/commands"]
deps = [
  "src/core",
  "src/tasks/laws",
  "src/ledger.rs",
  "src/gate",
  "src/court",
  "src/packs",
  "src/tasks",
  "src/wip/store.rs",
  "src/wip/task.rs",
  "src/wip_tasks",
]

[units.".".inner."src/wip"]
deps = []

[units.".".inner."src/wip/job"]
deps = []

[units.".".inner."src/wip/trace"]
deps = ["src/wip/job"]

[units.".".inner."src/wip/kernel"]
deps = ["src/wip/trace"]

[units.".".inner."src/wip/layout.rs"]
deps = []

[units.".".inner."src/wip/scope.rs"]
deps = ["src/wip/job", "src/wip/kernel", "src/wip/trace", "src/wip/layout.rs"]

[units.".".inner."src/wip/store.rs"]
deps = ["src/wip/job", "src/wip/trace"]

[units.".".inner."src/wip/pull.rs"]
deps = ["src/wip/job", "src/wip/trace", "src/wip/store.rs"]

[units.".".inner."src/wip/task.rs"]
deps = [
  "src/wip/job",
  "src/wip/trace",
  "src/wip/layout.rs",
  "src/wip/pull.rs",
  "src/wip/scope.rs",
  "src/wip/store.rs",
]

[units.".".inner."src/wip/plan.rs"]
deps = ["src/wip/trace", "src/wip/pull.rs", "src/wip/scope.rs", "src/wip/store.rs", "src/wip/task.rs"]

[units.".".inner."src/wip/worker.rs"]
deps = [
  "src/wip/job",
  "src/wip/kernel",
  "src/wip/trace",
  "src/wip/layout.rs",
  "src/wip/pull.rs",
  "src/wip/scope.rs",
  "src/wip/store.rs",
  "src/wip/task.rs",
]

[units.".".inner."src/wip/run"]
deps = [
  "src/wip/job",
  "src/wip/kernel",
  "src/wip/trace",
  "src/wip/layout.rs",
  "src/wip/plan.rs",
  "src/wip/pull.rs",
  "src/wip/scope.rs",
  "src/wip/store.rs",
  "src/wip/task.rs",
  "src/wip/worker.rs",
]

[units.".".inner."src/wip/exhibit"]
deps = [
  "src/wip/trace",
  "src/wip/run",
  "src/wip/plan.rs",
  "src/wip/pull.rs",
  "src/wip/scope.rs",
  "src/wip/store.rs",
  "src/wip/task.rs",
]

[units.".".inner."src/wip/registry.rs"]
deps = ["src/wip/exhibit", "src/wip/task.rs"]

[units.".".inner."src/wip_tasks"]
deps = [
  "src/core",
  "src/wip/job",
  "src/wip/trace",
  "src/wip/layout.rs",
  "src/wip/pull.rs",
  "src/wip/scope.rs",
  "src/wip/store.rs",
  "src/wip/task.rs",
]
