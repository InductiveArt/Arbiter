# The brief: the needs arbiter answers, as cases, each need bound to the
# claims proving it. The gate holds every need answered and every claim wired.

[[case]]
name = "units"
story = "manifests carve a repository into units before anything is judged"

  [[case.need]]
  need = "every manifest declares a unit, and files belong to the deepest one"
  claims = [
    ". |  | every manifest declares a unit",
    ". |  | the deepest unit claims the file",
  ]

  [[case.need]]
  need = "the resolved unit graph is drawable, declared against real"
  claims = [
    ". |  | the resolved graph draws itself declared against real",
    ". |  | the families of every folder travel with the snapshot",
  ]

  [[case.need]]
  need = "tests, fixtures, ignored folders and containers are told apart from code"
  claims = [
    ". |  | a test is told by its name or its folder",
    ". |  | a git ignored folder is not the repository",
    ". |  | a workspace manifest with no entry is a container",
    ". |  | a buf workspace bounds its modules without being judged",
    ". |  | a cargo workspace without a package is a container",
  ]

  [[case.need]]
  need = "a nested repository is another jurisdiction, named and never crossed"
  claims = [". |  | a folder with its own arbiter is another repository"]

[[case]]
name = "examiner"
story = "arbiter verifies a case's behavior itself: through the door, against the raw store"

  [[case.need]]
  need = "a service declares the env bridge that places its world"
  claims = [". |  | the service env names its world"]

  [[case.need]]
  need = "a case declares its trial: moves through the door, a probe on the store"
  claims = [". |  | a case trial declares the moves and the probe"]

  [[case.need]]
  need = "the examiner performs the trial and writes receipts in its own voice"
  manual = "arbiter examine exhibits/reader - six steps green; the planted volume lie is refuted while the exhibit's own gate stays clean"

[[case]]
name = "plans"
story = "deployment is declared before it is possible: judged intent, actuator left open"

  [[case.need]]
  need = "a plan's references resolve: services, volumes and units all exist"
  claims = [
    ". |  | a phantom service is named wherever it is dialed",
    ". |  | a service names the unit that builds it or stays open",
  ]

  [[case.need]]
  need = "bring-up is construction: the needs of a plan form an order"
  claims = [". |  | the bringup forms an order or the plan cannot boot"]

  [[case.need]]
  need = "state is declared and backed, never implicit"
  claims = [". |  | state is declared and backed or named"]

  [[case.need]]
  need = "channels carry the called service's consent, and dead grants are named"
  claims = [". |  | a channel needs the called services consent"]

  [[case.need]]
  need = "every service is placed by a plan, and no machine is overcommitted"
  claims = [". |  | a plan fits its machines and places every service"]

  [[case.need]]
  need = "what falls with one service is answerable before it ever falls"
  claims = [". |  | the impact of a service names who stands on it"]

  [[case.need]]
  need = "the bring-up reads as a ladder before anything exists to run"
  claims = [". |  | the bringup ladder reads in order"]

  [[case.need]]
  need = "a service multiplies by replicas and serves through declared doors"
  claims = [
    ". |  | a replica count scales the plans load",
    ". |  | a door routes to a declared service",
  ]

[[case]]
name = "folders"
story = "a unit's inner graph holds its own law, and a child only tightens"

  [[case.need]]
  need = "a declared folder consents outward and inward, and its dead patterns are named"
  claims = [". |  | a declared folder consents both ways inside its unit"]

  [[case.need]]
  need = "folder law composes conjunctively over every declared ancestor"
  claims = [". |  | a child folder only tightens what the unit allows"]

  [[case.need]]
  need = "a file is a leaf of the folder tree, not a third grain"
  claims = [". |  | a file declares as a leaf of the folder tree"]

  [[case.need]]
  need = "every folder's children form an order; a deliberate cycle is one signed exact set"
  claims = [
    ". |  | a folder whose children cycle is named",
    ". |  | an exact member set quiets one cycle and stales when it dissolves",
  ]

  [[case.need]]
  need = "the tangles are readable before they are judged"
  claims = [". |  | the tangles read lists entangled siblings largest first"]

[[case]]
name = "resolution"
story = "an import reaches the file its module path names, in every language"

  [[case.need]]
  need = "uses resolve to definitions through routes, barrels and chains"
  claims = [
    ". |  | a used symbol keeps its resolved user",
    ". |  | a whole module import reaches the name through its chain",
    ". |  | a name crosses units through the route and its barrels",
    ". |  | a wildcard route admits only what it spans",
    ". |  | dots fold away and parents climb",
  ]

  [[case.need]]
  need = "a namespace import keeps the whole surface alive"
  claims = [". |  | a namespace import keeps the whole surface"]

  [[case.need]]
  need = "a run-time import is judged: a literal reaches, a computed one is named"
  claims = [". |  | a computed python import is named and a literal reaches"]

  [[case.need]]
  need = "python and rust module paths reach their files and no lookalike"
  claims = [
    ". |  | a module path reaches its file or its package",
    ". |  | a longer name sharing a suffix is another module",
    ". |  | the crate keyword reaches either crate root",
    ". |  | a segment reaches its module file and no lookalike",
  ]

  [[case.need]]
  need = "generated code answers for the contract it was generated from"
  claims = [". |  | a contract is reached through generated code in both languages"]

[[case]]
name = "judgment"
story = "the graph plane finds what breaks the laws and names it"

  [[case.need]]
  need = "the fixture's findings are the known answer, winnow and integrity alike"
  claims = [
    ". |  | the fixture yields its known findings",
    ". |  | integrity names the cycle and each reexport",
  ]

  [[case.need]]
  need = "a protocol satisfied by shape is still named"
  claims = [
    ". |  | a class standing where a protocol is asked names it",
    ". |  | a class standing where an interface is asked names it",
  ]

  [[case.need]]
  need = "a symbol reached only by tests of a planned case is nascent, never dead"
  claims = [". |  | a symbol reached only by commissioned tests is nascent not dead"]

  [[case.need]]
  need = "a finding names the law it breaks, and every printed name drills"
  claims = [
    ". |  | every finding names a law the matrix drills",
    ". |  | a gated law drills but is not findable",
  ]

  [[case.need]]
  need = "a published unit keeps its unused surface"
  claims = [". |  | a published unit keeps its unused surface"]

  [[case.need]]
  need = "visibility patterns span folders exactly"
  claims = [". |  | a star covers the folder and everything below"]

  [[case.need]]
  need = "a comment names only what its file reaches"
  claims = [
    ". |  | a name the file reaches passes and a foreign one is found",
    ". |  | a name quoted in a string is within reach",
  ]

[[case]]
name = "the-bar"
story = "a unit's declared environment meets the pack's bar, which never lowers"

  [[case.need]]
  need = "the typescript dials name each unset or lowered option"
  claims = [
    ". |  | the bar names each unset option and leaves a met one",
    ". |  | a lowered option is named with its value",
  ]

  [[case.need]]
  need = "the python dials name lowered settings, checkers and excludes"
  claims = [
    ". |  | a setting lowering the bar is named with its reason",
    ". |  | a lowered checker rule and mode are named",
    ". |  | an environment setting passes the dials",
    ". |  | an exclude may name generated code and nothing else",
  ]

  [[case.need]]
  need = "the rust dials name a lint turned to allow and pass one raised to deny"
  claims = [
    ". |  | a lint turned to allow is named in either form",
    ". |  | a lint raised to deny passes the dials",
  ]

[[case]]
name = "third-parties"
story = "dependencies come from the locked registry, at one version, licensed"

  [[case.need]]
  need = "a third party declared and never reached is named for deletion"
  claims = [". |  | a third party declared and never reached is named"]

  [[case.need]]
  need = "a recorded suppression quiets unused-dependency alone, scoped and counted, and one quieting nothing is stale"
  claims = [
    ". |  | a record suppression quiets the package it names",
    ". |  | a suppression that quiets nothing is stale",
    ". |  | a record blanket is refused never recorded",
  ]

  [[case.need]]
  need = "a contract's import outside its module needs a declared dependency"
  claims = [". |  | a contracts import outside its module needs a declared dependency"]

  [[case.need]]
  need = "a dependency outside the registry or the workspace is named"
  claims = [
    ". |  | a dependency pulled past the registry is named",
    ". |  | a git or absolute path dependency is named",
    ". |  | a dependency outside the registry or workspace is named",
  ]

  [[case.need]]
  need = "every lock format yields what units can reach"
  claims = [
    ". |  | a pnpm lock yields each package with peers stripped",
    ". |  | an npm lock keeps what units reach and skips links and nested copies",
  ]

  [[case.need]]
  need = "licenses are read from what the ecosystems materialized"
  claims = [
    ". |  | a license comes from the expression the field or the classifier",
    ". |  | a license is the string or the object form or unstated",
    ". |  | one allowed branch of an or passes",
    ". |  | a common spelling folds to its spdx name",
  ]

[[case]]
name = "ledger"
story = "every suppression is counted against the user's signature"

  [[case.need]]
  need = "named suppressions are counted, blankets refused, the reference absorbs the known"
  claims = [
    ". |  | the ledger counts a named suppression and refuses a blanket",
    ". |  | a record suppression is counted in the account",
    ". |  | the reference absorbs known entries and names the extra",
  ]

  [[case.need]]
  need = "a record the user wrote never silently degrades"
  claims = [
    ". |  | a broken reference is named never read as virgin",
    ". |  | a broken unit declaration is named never read as virgin",
  ]

  [[case.need]]
  need = "demand is a signature: the reference records the stated needs"
  claims = [". |  | the signature records the stated needs"]

[[case]]
name = "claims"
story = "behavior is claimed by tests and commissioned by the brief"

  [[case.need]]
  need = "every language's tests claim their sentences under their frames"
  claims = [". |  | each language claims its sentences under their frames"]

  [[case.need]]
  need = "a claim once signed leaves only with the user's signature"
  claims = [". |  | a claim that vanished without signature is a finding"]

  [[case.need]]
  need = "the brief states each need and roars at the unwired"
  claims = [". |  | the brief states each need and roars at the unwired"]

  [[case.need]]
  need = "a binding folds runs of spaces, so a hand-typed one still wires"
  claims = [". |  | a binding typed with one space wires a claim printed with two"]

  [[case.need]]
  need = "a brief finding points at the line it judges"
  claims = [". |  | a brief finding points at its own line"]

  [[case.need]]
  need = "a case is seated: placed in a built unit, serving a stated need"
  claims = [
    ". |  | an orphan case is named",
    ". |  | a misplaced case is named",
  ]

  [[case.need]]
  need = "a trial carries its mandate: it proves needs its case states"
  claims = [
    ". |  | a case trial declares the moves and the probe",
    ". |  | a trial proving an unstated need is named",
    ". |  | a trial proving nothing is named",
  ]

[[case]]
name = "rhyme"
story = "structurally equivalent code is named, never judged"

  [[case.need]]
  need = "equal bones group shapes and flesh splits a paste from a drift"
  claims = [". |  | bones group the shapes and flesh splits perfect from slant"]

[[case]]
name = "the-run"
story = "a gate runs pinned tools, warm where nothing moved, repairing first when fixing"

  [[case.need]]
  need = "a run is a tree of tasks, each timed, children under the task that spawned them"
  claims = [
    ". |  | a task tree nests children under the task that spawned them",
    ". |  | a noted leaf sits beside the tasks that run",
  ]

  [[case.need]]
  need = "every run leaves the court: one page, one snapshot, beside the report"
  claims = [". |  | the court page embeds the snapshot whole"]

  [[case.need]]
  need = "outcomes are tallied per check and a missing binary is a broken machine"
  claims = [
    ". |  | a tally counts passes and failures per check with their time",
    ". |  | an absent binary does not answer and a present one does",
  ]

  [[case.need]]
  need = "a unit green under an unchanged input cone skips its tools"
  claims = [
    ". |  | a warm key follows the dependency cone",
    ". |  | the store answers the key and forgets a failure",
  ]

  [[case.need]]
  need = "a fixing run mends the packs' own findings in place"
  claims = [
    ". |  | fix splits an import to one per line",
    ". |  | fix splits a use to one per line",
  ]

  [[case.need]]
  need = "the first gate seeds the decision files and never overwrites them"
  claims = [". |  | the first gate seeds the decision files and never overwrites"]

  [[case.need]]
  need = "a unit's tests reach every branch of its source"
  planned = true

[[case]]
name = "drift"
story = "generated code matches its contract, and a break is a finding"

  [[case.need]]
  need = "a missing, a drifted and an orphaned generated file are each named"
  claims = [". |  | a missing a drifted and an orphaned file are each named"]

[[case]]
name = "teaching"
story = "the tool teaches its own use, and the taught word cannot drift"

  [[case.need]]
  need = "the skill speaks each command with its own line"
  claims = [". |  | the skill speaks each command with its own line"]

  [[case.need]]
  need = "the bare call prints the whole grammar"
  manual = "run arbiter with no command and read the table"

  [[case.need]]
  need = "every adopted file names the arbiter that wrote it"
  claims = [". |  | a stamp names the arbiter that wrote the file"]

  [[case.need]]
  need = "adopt never writes the law backwards"
  claims = [". |  | a file from a newer arbiter is never written backwards"]

  [[case.need]]
  need = "a unit's birth and an arrival on living code are each taught"
  manual = "read the arbiter-genesis and arbiter-arrival skills"

  [[case.need]]
  need = "every rule sits in one group, and the group answers for its laws"
  claims = [". |  | every rule sits in exactly one group"]

[[case]]
name = "task plan"
story = "work is declared as tasks registered in the binary and wired by the types they read and produce; a plan selects them by name and a run is verified whole before anything starts; each attempt runs as a process of its own, accounted by the kernel, and every record lands on disk under its run; a read declares when it fires, so both branches of a judgment are declared and the run takes one"

  [[case.need]]
  need = "a task declares what it reads from its signature, when each read fires, and what it produces from its return; its body runs on the decoded inputs and its product is encoded"
  claims = [
    ". |  | a task declares its reads from its signature",
    ". |  | a task declares when each read fires",
    ". |  | a task reading nothing declares no reads",
    ". |  | a task performs its body on the decoded inputs and encodes its product",
  ]

  [[case.need]]
  need = "a read fired by failing carries who failed and why; one fired by finishing carries the outcome and the value left"
  claims = [
    ". |  | a failure read carries who failed and why",
    ". |  | a finishing read carries the outcome and the value left",
  ]

  [[case.need]]
  need = "a plan selects its tasks by name from those the binary knows, in the order named, and refuses, before anything runs, a name the binary does not know, two producers of one type, a cycle, two tasks of one name, or a read fired by failing or finishing of a type no task produces"
  claims = [
    ". |  | a plan refuses a task the registry does not know",
    ". |  | a plan holds its tasks in the order named",
    ". |  | a plan rejects two tasks of one name",
    ". |  | a plan rejects a type two tasks produce",
    ". |  | a plan rejects a cycle in its data",
    ". |  | a plan rejects a read fired by failing or finishing of a type no task produces",
  ]

  [[case.need]]
  need = "a plan knows its own wiring: what it must be seeded with, who waits on whom whatever fires the read, and where each task stands"
  claims = [
    ". |  | a plan names the types it must be seeded with",
    ". |  | a plan wires a reader behind its producer",
    ". |  | a plan wires a reader of a failure behind its producer like any reader",
    ". |  | a plan finds a task s position by name",
  ]

  [[case.need]]
  need = "a value is held by type as the encoded bytes it crosses between processes as, written once to disk so the process reading it is handed a file, and decoded back by its type; a value that does not decode as its type fails the attempt by name"
  claims = [
    ". |  | a value is read back by its type",
    ". |  | a type never put reads as nothing",
    ". |  | a value is held as the bytes it crosses as",
    ". |  | placing a store writes each value once into the folder",
    ". |  | a value that does not decode as its type fails the attempt by name",
  ]

  [[case.need]]
  need = "parts are pulled in the order asked: the value for a read fired by passing, the completion for one fired by failing or finishing, both for a finishing read whose producer left a value"
  claims = [
    ". |  | pulled values come in the reads order",
    ". |  | a read fired by failing or finishing pulls the completion not only a value",
  ]

  [[case.need]]
  need = "a reader runs only when every read fires: a skipped producer skips it, a branch not taken leaves it unneeded, each named by the task that decided, and a finishing read fires whatever happened"
  claims = [
    ". |  | a reader whose every read fires has to run",
    ". |  | a failure read of a task that passed is unneeded and names that task",
    ". |  | a value read of a branch not taken is unneeded for the same reason",
    ". |  | a skipped producer skips its reader even beside a branch not taken",
    ". |  | a finishing read fires whatever the producer s outcome",
  ]

  [[case.need]]
  need = "a run starts a task the moment its inputs are held, so independent tasks run at once"
  claims = [
    ". |  | a task starts only once every type it reads is produced",
    ". |  | independent tasks run at the same time",
  ]

  [[case.need]]
  need = "a run is verified whole before it starts: every type read is produced or seeded, no seed shadows a producer, the medium can perform an attempt, which for processes means the worker binary is an executable file, and the root is a folder; every problem is named in one refusal and no process starts"
  claims = [
    ". |  | a run is refused with every problem named and nothing started",
    ". |  | a run refuses to start when a read type is neither produced nor seeded",
    ". |  | a run refuses a seed of a type a task produces",
    ". |  | a run refuses a worker that is not an executable file",
  ]

  [[case.need]]
  need = "the run's decisions come from a flow with nothing in it that waits, reads a file or starts a process: fed what ended, it answers with the attempts wanted, the stops, the records that followed and the tasks settled, so every rule of readiness, branching, retry, cancel and replay is proved without running anything"
  claims = [
    ". |  | a flow asks first for the tasks whose reads are all held",
    ". |  | a flow asks for a reader the moment its producer passes",
    ". |  | a flow skips the readers of a failed task and asks for its failure readers",
    ". |  | a flow asks again after a failure until the retries are spent",
    ". |  | a flow cancelled stops what was asked and a withdrawn attempt ends as attempt zero",
    ". |  | a flow keys a cached task and replays a product as attempt zero",
  ]

  [[case.need]]
  need = "a run tells an observer each event as it happens: an attempt starting on its slot, each record as it lands, each task settling, and the run finishing with its report, in that order"
  claims = [
    ". |  | an observer hears each start each record each settling and the finish in order",
  ]

  [[case.need]]
  need = "a failed task takes down only what stands on it, named by the task that failed"
  claims = [
    ". |  | a failed task skips every task standing on it and the rest still run",
  ]

  [[case.need]]
  need = "a task reading a failure runs only when that task fails, and the passed branch is skipped then; when the task passes, the failure's reader and what stands on it are unneeded and the run stays clean"
  claims = [
    ". |  | a task reading a failure runs when that task fails and the passed branch is skipped",
    ". |  | a task reading a failure is unneeded when that task passes and the run stays clean",
    ". |  | what stands on a branch not taken is unneeded for the same reason",
    ". |  | an outcome is clean when it passed or was not needed",
  ]

  [[case.need]]
  need = "a task reading a completion runs whatever happened to its producer"
  claims = [
    ". |  | a task reading a completion runs whatever happened to its producer",
  ]

  [[case.need]]
  need = "every task keeps its own record, with path ids, inner steps and nested plans under it; each task of a nested plan is a process of its own, its folder under its parent's"
  claims = [
    ". |  | every task keeps its own step in plan order with path ids",
    ". |  | an inner step nests under its parent with a path id",
    ". |  | a failing inner step is recorded and its failure returned",
    ". |  | a plan run inside a task nests its steps under that task",
  ]

  [[case.need]]
  need = "every run has its own id, ordered and read back from its text, and every attempt at a task is a job named by the run, the task's path and the attempt; a task never attempted is attempt 0"
  claims = [
    ". |  | two run ids taken in a row differ",
    ". |  | a run id reads back from its text and other text reads as nothing",
    ". |  | a job id reads as run path and attempt",
    ". |  | a run has its own id and every step carries it with the attempt",
  ]

  [[case.need]]
  need = "every attempt is a process of its own: the worker binary is handed the attempt's folder, finds the task by name, checks the inputs against the task's declaration, and leaves its product and record there; an attempt that cannot be made leaves a failed record or none"
  claims = [
    ". |  | a worker performs the named task on the inputs handed and leaves its product and record",
    ". |  | a worker asked for a task it does not know leaves a failed record",
    ". |  | a worker handed inputs the task does not declare fails before the body runs",
    ". |  | a worker without an order makes no attempt",
    ". |  | a worker that cannot start fails its attempt",
  ]

  [[case.need]]
  need = "a run is served by a bounded number of slots, so wide work runs as wide as the machine allows and no wider; each attempt records its slot and how long it waited for one"
  claims = [
    ". |  | one slot runs the tasks one after the other",
    ". |  | an attempt records its slot and the time it waited for one",
  ]

  [[case.need]]
  need = "a task allows one attempt of any length and computes every time unless told otherwise; a failed attempt earns the retries declared, each attempt keeps its record, and a failure's readers see the last attempt"
  claims = [
    ". |  | a task allows one attempt of any length and computes every time unless told otherwise",
    ". |  | a failed attempt is tried again up to the retries and each keeps its record",
    ". |  | a failure read fires only once the retries are spent",
  ]

  [[case.need]]
  need = "an attempt past its time is asked to stop, its whole process tree with it, and forced once the grace is spent; a body that checks in stops at its next checkpoint and leaves its record, a body that does not is killed, and either way the slot is freed"
  claims = [
    ". |  | a task out of time is timed out and its process tree ended so the slot is freed",
    ". |  | a body that checks in stops at its next checkpoint once out of time",
    ". |  | a body deaf to the request to stop is killed once the grace is spent",
    ". |  | a checkpoint fails once the job is cancelled",
    ". |  | a command runs to its end with its output read",
    ". |  | a command is killed once the job is cancelled",
    ". |  | a signal to a group ends the leader and what it started",
  ]

  [[case.need]]
  need = "cancelling a run stops what is out and what was about to go out; only what the stopping unlocks still runs, so a failure's readers answer it"
  claims = [
    ". |  | a cancel token wakes each asker once and a late asker at once",
    ". |  | cancelling a run stops what is out and about to go out while a failure s readers still answer",
  ]

  [[case.need]]
  need = "a timed-out or cancelled attempt ended without passing: it skips its value readers and fires its failure readers, like a failure"
  claims = [
    ". |  | an outcome failed when an attempt ended without passing",
    ". |  | a timed out or cancelled producer skips its value readers and fires its failure readers",
  ]

  [[case.need]]
  need = "a body that panics fails its attempt like one that returns a failure, with what it said, and the run goes on"
  claims = [
    ". |  | a body that panics fails its attempt and the rest of the run goes on",
  ]

  [[case.need]]
  need = "a body is decorated before the task erases its types, so a decorated task declares exactly what the plain one does"
  claims = [
    ". |  | a decorated body keeps the task s declaration",
  ]

  [[case.need]]
  need = "a cached task's product is stored under a key made of the worker binary, the task and its inputs; the same key is replayed without a process and the record says so, any other key is computed"
  claims = [
    ". |  | a product s key follows the task and its inputs and nothing else",
    ". |  | a cached task is replayed from the store on the same inputs and computed on others",
  ]

  [[case.need]]
  need = "every frame measures itself from inside: when it began, how long it ran, and the CPU time of its thread; an inner frame is already inside its parent's figures; a body records its own measures by name"
  claims = [
    ". |  | a frame records when it began and how long it ran",
    ". |  | a frame is charged the cpu time its thread spends",
    ". |  | a sleeping frame spends wall but little cpu",
    ". |  | a thread s cpu time grows while it computes and not while it sleeps",
    ". |  | an inner step is an inner frame counted inside its parent",
    ". |  | a measure is recorded by name",
  ]

  [[case.need]]
  need = "every process is reaped with the kernel's account of it: how it ended, by exit code or signal, its CPU, its peak memory, its faults and switches; a process that ended is seen before it is reaped, so what it left in its group is ended with it"
  claims = [
    ". |  | a reaped child reports how it ended and what it used",
    ". |  | a running child reaps as nothing yet and a killed one as its signal",
    ". |  | an ended child is seen as exited before it is reaped",
    ". |  | a command s account is recorded on the frame that ran it",
  ]

  [[case.need]]
  need = "an attempt's record carries the kernel's account of its own process, and a report sums the accounts of every attempt of its own tasks: times and counts sum, the peak keeps the largest"
  claims = [
    ". |  | an attempt s record carries the kernel s account of its process",
    ". |  | a report sums the kernel s account of every attempt",
    ". |  | adding accounts sums time and counts and keeps the largest peak",
  ]

  [[case.need]]
  need = "every attempt leaves on disk, under its run, the order it was handed, the record it left, its product and what it printed; a record is plain data that reads back equal; a run writes its whole report when it ends"
  claims = [
    ". |  | a run leaves every attempt s order record product and output on disk",
    ". |  | a record written as json reads back equal",
  ]

  [[case.need]]
  need = "a root keeps the newest runs, every run still going, and the products they refer to; the rest is swept at the end of each run"
  claims = [
    ". |  | a run keeps only the newest runs and the products they refer to",
    ". |  | a sweep keeps the newest runs and the products they refer to and drops the rest",
    ". |  | a sweep leaves a run still going whatever its age",
  ]

  [[case.need]]
  need = "what a process prints is kept on disk up to the cap and counted whole"
  claims = [
    ". |  | a chatty worker s output is capped on disk and counted whole",
  ]

  [[case.need]]
  need = "the gate's judgment runs as one plan"
  planned = true
