# The brief: the needs arbiter answers, as cases, each need bound to the
# claims proving it. The gate holds every need answered and every claim wired.

[[case]]
name = "units"
story = "manifests carve a repository into units before anything is judged"

  [[case.need]]
  need = "every manifest declares a unit, and files belong to the deepest one"
  claims = [
    ". |  | every manifest declares a unit",
    ". |  | the deepest unit claims the file",
  ]

  [[case.need]]
  need = "the resolved unit graph is drawable, declared against real"
  claims = [
    ". |  | the resolved graph draws itself declared against real",
    ". |  | the families of every folder travel with the snapshot",
  ]

  [[case.need]]
  need = "tests, fixtures, ignored folders and containers are told apart from code"
  claims = [
    ". |  | a test is told by its name or its folder",
    ". |  | a git ignored folder is not the repository",
    ". |  | a workspace manifest with no entry is a container",
    ". |  | a buf workspace bounds its modules without being judged",
    ". |  | a cargo workspace without a package is a container",
  ]

  [[case.need]]
  need = "a nested repository is another jurisdiction, named and never crossed"
  claims = [". |  | a folder with its own arbiter is another repository"]

[[case]]
name = "examiner"
story = "arbiter verifies a case's behavior itself: through the door, against the raw store"

  [[case.need]]
  need = "a service declares the env bridge that places its world"
  claims = [". |  | the service env names its world"]

  [[case.need]]
  need = "a case declares its trial: moves through the door, a probe on the store"
  claims = [". |  | a case trial declares the moves and the probe"]

  [[case.need]]
  need = "the examiner performs the trial and writes receipts in its own voice"
  manual = "arbiter examine exhibits/reader - six steps green; the planted volume lie is refuted while the exhibit's own gate stays clean"

[[case]]
name = "plans"
story = "deployment is declared before it is possible: judged intent, actuator left open"

  [[case.need]]
  need = "a plan's references resolve: services, volumes and units all exist"
  claims = [
    ". |  | a phantom service is named wherever it is dialed",
    ". |  | a service names the unit that builds it or stays open",
  ]

  [[case.need]]
  need = "bring-up is construction: the needs of a plan form an order"
  claims = [". |  | the bringup forms an order or the plan cannot boot"]

  [[case.need]]
  need = "state is declared and backed, never implicit"
  claims = [". |  | state is declared and backed or named"]

  [[case.need]]
  need = "channels carry the called service's consent, and dead grants are named"
  claims = [". |  | a channel needs the called services consent"]

  [[case.need]]
  need = "every service is placed by a plan, and no machine is overcommitted"
  claims = [". |  | a plan fits its machines and places every service"]

  [[case.need]]
  need = "what falls with one service is answerable before it ever falls"
  claims = [". |  | the impact of a service names who stands on it"]

  [[case.need]]
  need = "the bring-up reads as a ladder before anything exists to run"
  claims = [". |  | the bringup ladder reads in order"]

  [[case.need]]
  need = "a service multiplies by replicas and serves through declared doors"
  claims = [
    ". |  | a replica count scales the plans load",
    ". |  | a door routes to a declared service",
  ]

[[case]]
name = "folders"
story = "a unit's inner graph holds its own law, and a child only tightens"

  [[case.need]]
  need = "a declared folder consents outward and inward, and its dead patterns are named"
  claims = [". |  | a declared folder consents both ways inside its unit"]

  [[case.need]]
  need = "folder law composes conjunctively over every declared ancestor"
  claims = [". |  | a child folder only tightens what the unit allows"]

  [[case.need]]
  need = "a file is a leaf of the folder tree, not a third grain"
  claims = [". |  | a file declares as a leaf of the folder tree"]

  [[case.need]]
  need = "every folder's children form an order; a deliberate cycle is one signed exact set"
  claims = [
    ". |  | a folder whose children cycle is named",
    ". |  | an exact member set quiets one cycle and stales when it dissolves",
  ]

  [[case.need]]
  need = "the tangles are readable before they are judged"
  claims = [". |  | the tangles read lists entangled siblings largest first"]

[[case]]
name = "resolution"
story = "an import reaches the file its module path names, in every language"

  [[case.need]]
  need = "uses resolve to definitions through routes, barrels and chains"
  claims = [
    ". |  | a used symbol keeps its resolved user",
    ". |  | a whole module import reaches the name through its chain",
    ". |  | a name crosses units through the route and its barrels",
    ". |  | a wildcard route admits only what it spans",
    ". |  | dots fold away and parents climb",
  ]

  [[case.need]]
  need = "a namespace import keeps the whole surface alive"
  claims = [". |  | a namespace import keeps the whole surface"]

  [[case.need]]
  need = "a run-time import is judged: a literal reaches, a computed one is named"
  claims = [". |  | a computed python import is named and a literal reaches"]

  [[case.need]]
  need = "python and rust module paths reach their files and no lookalike"
  claims = [
    ". |  | a module path reaches its file or its package",
    ". |  | a longer name sharing a suffix is another module",
    ". |  | the crate keyword reaches either crate root",
    ". |  | a segment reaches its module file and no lookalike",
  ]

  [[case.need]]
  need = "generated code answers for the contract it was generated from"
  claims = [". |  | a contract is reached through generated code in both languages"]

[[case]]
name = "judgment"
story = "the graph plane finds what breaks the laws and names it"

  [[case.need]]
  need = "the fixture's findings are the known answer, winnow and integrity alike"
  claims = [
    ". |  | the fixture yields its known findings",
    ". |  | integrity names the cycle and each reexport",
  ]

  [[case.need]]
  need = "a protocol satisfied by shape is still named"
  claims = [
    ". |  | a class standing where a protocol is asked names it",
    ". |  | a class standing where an interface is asked names it",
  ]

  [[case.need]]
  need = "a symbol reached only by tests of a planned case is nascent, never dead"
  claims = [". |  | a symbol reached only by commissioned tests is nascent not dead"]

  [[case.need]]
  need = "a finding names the law it breaks, and every printed name drills"
  claims = [
    ". |  | every finding names a law the matrix drills",
    ". |  | a gated law drills but is not findable",
  ]

  [[case.need]]
  need = "a published unit keeps its unused surface"
  claims = [". |  | a published unit keeps its unused surface"]

  [[case.need]]
  need = "visibility patterns span folders exactly"
  claims = [". |  | a star covers the folder and everything below"]

  [[case.need]]
  need = "a comment names only what its file reaches"
  claims = [
    ". |  | a name the file reaches passes and a foreign one is found",
    ". |  | a name quoted in a string is within reach",
  ]

[[case]]
name = "the-bar"
story = "a unit's declared environment meets the pack's bar, which never lowers"

  [[case.need]]
  need = "the typescript dials name each unset or lowered option"
  claims = [
    ". |  | the bar names each unset option and leaves a met one",
    ". |  | a lowered option is named with its value",
  ]

  [[case.need]]
  need = "the python dials name lowered settings, checkers and excludes"
  claims = [
    ". |  | a setting lowering the bar is named with its reason",
    ". |  | a lowered checker rule and mode are named",
    ". |  | an environment setting passes the dials",
    ". |  | an exclude may name generated code and nothing else",
  ]

  [[case.need]]
  need = "the rust dials name a lint turned to allow and pass one raised to deny"
  claims = [
    ". |  | a lint turned to allow is named in either form",
    ". |  | a lint raised to deny passes the dials",
  ]

[[case]]
name = "third-parties"
story = "dependencies come from the locked registry, at one version, licensed"

  [[case.need]]
  need = "a third party declared and never reached is named for deletion"
  claims = [". |  | a third party declared and never reached is named"]

  [[case.need]]
  need = "a recorded suppression quiets unused-dependency alone, scoped and counted, and one quieting nothing is stale"
  claims = [
    ". |  | a record suppression quiets the package it names",
    ". |  | a suppression that quiets nothing is stale",
    ". |  | a record blanket is refused never recorded",
  ]

  [[case.need]]
  need = "a contract's import outside its module needs a declared dependency"
  claims = [". |  | a contracts import outside its module needs a declared dependency"]

  [[case.need]]
  need = "a dependency outside the registry or the workspace is named"
  claims = [
    ". |  | a dependency pulled past the registry is named",
    ". |  | a git or absolute path dependency is named",
    ". |  | a dependency outside the registry or workspace is named",
  ]

  [[case.need]]
  need = "every lock format yields what units can reach"
  claims = [
    ". |  | a pnpm lock yields each package with peers stripped",
    ". |  | an npm lock keeps what units reach and skips links and nested copies",
  ]

  [[case.need]]
  need = "licenses are read from what the ecosystems materialized"
  claims = [
    ". |  | a license comes from the expression the field or the classifier",
    ". |  | a license is the string or the object form or unstated",
    ". |  | one allowed branch of an or passes",
    ". |  | a common spelling folds to its spdx name",
  ]

[[case]]
name = "ledger"
story = "every suppression is counted against the user's signature"

  [[case.need]]
  need = "named suppressions are counted, blankets refused, the reference absorbs the known"
  claims = [
    ". |  | the ledger counts a named suppression and refuses a blanket",
    ". |  | a record suppression is counted in the account",
    ". |  | the reference absorbs known entries and names the extra",
  ]

  [[case.need]]
  need = "a record the user wrote never silently degrades"
  claims = [
    ". |  | a broken reference is named never read as virgin",
    ". |  | a broken unit declaration is named never read as virgin",
  ]

  [[case.need]]
  need = "demand is a signature: the reference records the stated needs"
  claims = [". |  | the signature records the stated needs"]

[[case]]
name = "claims"
story = "behavior is claimed by tests and commissioned by the brief"

  [[case.need]]
  need = "every language's tests claim their sentences under their frames"
  claims = [". |  | each language claims its sentences under their frames"]

  [[case.need]]
  need = "a claim once signed leaves only with the user's signature"
  claims = [". |  | a claim that vanished without signature is a finding"]

  [[case.need]]
  need = "the brief states each need and roars at the unwired"
  claims = [". |  | the brief states each need and roars at the unwired"]

  [[case.need]]
  need = "a binding folds runs of spaces, so a hand-typed one still wires"
  claims = [". |  | a binding typed with one space wires a claim printed with two"]

  [[case.need]]
  need = "a brief finding points at the line it judges"
  claims = [". |  | a brief finding points at its own line"]

  [[case.need]]
  need = "a case is seated: placed in a built unit, serving a stated need"
  claims = [
    ". |  | an orphan case is named",
    ". |  | a misplaced case is named",
  ]

  [[case.need]]
  need = "a trial carries its mandate: it proves needs its case states"
  claims = [
    ". |  | a case trial declares the moves and the probe",
    ". |  | a trial proving an unstated need is named",
    ". |  | a trial proving nothing is named",
  ]

[[case]]
name = "rhyme"
story = "structurally equivalent code is named, never judged"

  [[case.need]]
  need = "equal bones group shapes and flesh splits a paste from a drift"
  claims = [". |  | bones group the shapes and flesh splits perfect from slant"]

[[case]]
name = "the-run"
story = "a gate runs pinned tools, warm where nothing moved, repairing first when fixing"

  [[case.need]]
  need = "every run leaves the court: one page, one snapshot, beside the report"
  claims = [". |  | the court page embeds the snapshot whole"]

  [[case.need]]
  need = "outcomes are tallied per check and a missing binary is a broken machine"
  claims = [
    ". |  | a tally counts passes and failures per check with their time",
    ". |  | an absent binary does not answer and a present one does",
  ]

  [[case.need]]
  need = "a unit green under an unchanged input cone skips its tools"
  claims = [
    ". |  | a warm key follows the dependency cone",
    ". |  | the store answers the key and forgets a failure",
  ]

  [[case.need]]
  need = "a fixing run mends the packs' own findings in place"
  claims = [
    ". |  | fix splits an import to one per line",
    ". |  | fix splits a use to one per line",
  ]

  [[case.need]]
  need = "the first gate seeds the decision files and never overwrites them"
  claims = [". |  | the first gate seeds the decision files and never overwrites"]

  [[case.need]]
  need = "a unit's tests reach every branch of its source"
  planned = true

[[case]]
name = "drift"
story = "generated code matches its contract, and a break is a finding"

  [[case.need]]
  need = "a missing, a drifted and an orphaned generated file are each named"
  claims = [". |  | a missing a drifted and an orphaned file are each named"]

[[case]]
name = "teaching"
story = "the tool teaches its own use, and the taught word cannot drift"

  [[case.need]]
  need = "the skill speaks each command with its own line"
  claims = [". |  | the skill speaks each command with its own line"]

  [[case.need]]
  need = "the bare call prints the whole grammar"
  manual = "run arbiter with no command and read the table"

  [[case.need]]
  need = "every adopted file names the arbiter that wrote it"
  claims = [". |  | a stamp names the arbiter that wrote the file"]

  [[case.need]]
  need = "adopt never writes the law backwards"
  claims = [". |  | a file from a newer arbiter is never written backwards"]

  [[case.need]]
  need = "a unit's birth and an arrival on living code are each taught"
  manual = "read the arbiter-genesis and arbiter-arrival skills"

  [[case.need]]
  need = "every rule sits in one group, and the group answers for its laws"
  claims = [". |  | every rule sits in exactly one group"]
